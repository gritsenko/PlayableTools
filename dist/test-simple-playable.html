<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Test Playable</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #4CAF50;
            color: white;
            text-align: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .content {
            background: rgba(0,0,0,0.2);
            padding: 40px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>🎯 Simple Playable</h1>
        <p>This is a test playable for validator injection.</p>
        <button onclick="testFunction()">Test Button</button>
        <div id="result"></div>
    </div>
    
    <script>
        function testFunction() {
            document.getElementById('result').innerHTML = '<p>Button clicked!</p>';
            console.log('Test function called');
        }
        
        // Check for Facebook validator
        window.addEventListener('load', () => {
            if (window.FbPlayableAd) {
                document.getElementById('result').innerHTML = '<p style="color: #90EE90;">✅ Facebook validator detected!</p>';
            } else {
                document.getElementById('result').innerHTML = '<p style="color: #FFB6C1;">ℹ️ No validator (default mode)</p>';
            }
        });
    </script>
</body>
</html>
