  <!-- Cache API Error Handler for Service Workers -->
  <script>
    // Patch Cache API to prevent "Entry already exists" errors
    // This must run before any service worker caching operations
    if ('caches' in self) {
      const originalPut = Cache.prototype.put;
      Cache.prototype.put = async function(request, response) {
        try {
          return await originalPut.call(this, request, response);
        } catch (error) {
          if (error instanceof DOMException && error.name === 'InvalidAccessError') {
            console.debug('[Cache API] Entry already exists, skipping duplicate cache operation');
            return;
          }
          throw error;
        }
      };
    }
  </script>
  
  <script>

  <script>
    (function () {
      var hash = window.location.hash ? window.location.hash.slice(1) : "";
      if (!hash) {
        return;
      }

      var shouldTreatAsLegacyRoute = hash.startsWith("/") || window.location.pathname === "/";
      if (!shouldTreatAsLegacyRoute) {
        return;
      }

      var normalized = hash.startsWith("/") ? hash : "/" + hash;
      var parts = normalized.split("?");
      var pathname = parts[0] || "/";
      var search = parts[1] ? "?" + parts[1] : "";
      history.replaceState({}, "", pathname + search);
    })();
  </script>
